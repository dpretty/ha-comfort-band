repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: banned-words
        name: Banned words check
        entry: bash scripts/check-banned-words.sh
        language: system
        pass_filenames: false
        always_run: true
